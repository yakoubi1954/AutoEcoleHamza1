name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk-r25b
      P4A_NDK_DIR: ${{ github.workspace }}/android-ndk-r25b
      P4A_sdk_dir: ${{ github.workspace }}/android-sdk
      P4A_ndk_api: "23"
      P4A_android_api: "35"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache Gradle & Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            .buildozer
          key: cache-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install "Cython==0.29.36" "buildozer==1.5.0"

      - name: Install Android cmdline-tools
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -L -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          unzip -q cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          rm -f cmdtools.zip
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK platforms & build-tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;36.1.0"

      - name: Download and setup NDK r25b
        run: |
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r25b-linux.zip
          unzip -q ndk.zip
          mv android-ndk-r25b "$ANDROID_NDK_HOME"
          rm -f ndk.zip

      - name: Build debug APK
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoEcoleHamza-debug-apk
          path: bin/*.apk
